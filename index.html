<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="秦毅的个人名片、作品、博客和留言板">
  <title>秦毅 · 个人名片</title>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="card">
    <header class="profile-header">
      <button class="avatar-wrapper" id="avatarWrapper" type="button" title="管理员登录后可更换头像" aria-label="更换头像" disabled>
        <span class="avatar-placeholder" id="avatarPlaceholder">秦</span>
        <img id="avatarImage" alt="秦毅的头像" hidden>
      </button>
      <input type="file" id="avatarInput" accept="image/jpeg,image/png,image/webp,image/gif" hidden>

      <div class="name-title">
        <h1>秦毅 <i class="fas fa-pencil-alt" aria-hidden="true"></i></h1>
        <div class="school-tag">
          <span><i class="fas fa-school" aria-hidden="true"></i> 杭州第二中学钱江学校</span>
          <span><i class="fas fa-university" aria-hidden="true"></i> 浙大城市学院</span>
        </div>
      </div>
      <div class="auth-actions">
        <button class="auth-button" id="loginButton" type="button"><i class="fas fa-lock"></i> 管理员登录</button>
        <button class="auth-button admin-only" id="logoutButton" type="button"><i class="fas fa-right-from-bracket"></i> 退出管理</button>
      </div>
    </header>

    <section class="info-grid" aria-label="个人信息">
      <article class="info-panel">
        <h2><i class="fas fa-user-astronaut" aria-hidden="true"></i> 关于我</h2>
        <div class="bio-content" contenteditable="false" id="bioContent" role="textbox" aria-label="个人简介"></div>
        <p class="click-hint admin-only"><i class="fas fa-edit" aria-hidden="true"></i> 点击编辑，失焦后自动保存</p>
      </article>
      <article class="info-panel">
        <h2><i class="fas fa-address-card" aria-hidden="true"></i> 联系</h2>
        <div class="contact-item"><i class="fas fa-phone-alt" aria-hidden="true"></i><span>15757117524</span></div>
        <div class="contact-item"><i class="fas fa-envelope" aria-hidden="true"></i><a href="mailto:wlsugx838372erqh@163.com">wlsugx838372erqh@163.com</a></div>
        <div class="contact-item"><i class="fas fa-map-pin" aria-hidden="true"></i><span>杭州 · 中国</span></div>
      </article>
    </section>

    <section class="content-section" aria-labelledby="worksTitle">
      <div class="section-header">
        <h2 id="worksTitle"><i class="fas fa-images" aria-hidden="true"></i> 作品 · 模型</h2>
        <button class="pill-button admin-only" id="addWorkBtn" type="button"><i class="fas fa-plus-circle" aria-hidden="true"></i> 添加作品</button>
      </div>
      <div class="works-grid" id="worksGrid" aria-live="polite"></div>
    </section>

    <section class="content-section" aria-labelledby="blogsTitle">
      <div class="section-header blog-header">
        <h2 id="blogsTitle"><i class="fas fa-pen-fancy" aria-hidden="true"></i> 个人博客</h2>
        <div class="blog-actions">
          <button class="pill-button admin-only" id="addBlogBtn" type="button"><i class="fas fa-plus-circle" aria-hidden="true"></i> 添加文章</button>
          <label class="search-box">
            <i class="fas fa-search" aria-hidden="true"></i>
            <span class="sr-only">搜索文章</span>
            <input type="search" id="searchInput" placeholder="搜索文章...">
          </label>
        </div>
      </div>
      <div class="blog-grid" id="blogGrid" aria-live="polite"></div>
    </section>

    <section class="guestbook-section" aria-labelledby="guestbookTitle">
      <div class="guestbook-header">
        <i class="fas fa-comment-dots" aria-hidden="true"></i>
        <h2 id="guestbookTitle">留言板</h2>
      </div>
      <form class="guestbook-form" id="commentForm">
        <label class="sr-only" for="guestName">你的名字</label>
        <input type="text" id="guestName" maxlength="80" placeholder="你的名字">
        <label class="sr-only" for="guestMessage">留言内容</label>
        <textarea id="guestMessage" maxlength="2000" placeholder="写留言..." rows="1" required></textarea>
        <button id="submitComment" type="submit"><i class="fas fa-paper-plane" aria-hidden="true"></i> 发送</button>
      </form>
      <div class="comments-list" id="commentsList" aria-live="polite"></div>
    </section>

    <p class="footer-note" id="connectionStatus">
      <i class="fas fa-circle-notch fa-spin" aria-hidden="true"></i> 正在连接 API…
    </p>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <dialog class="login-dialog" id="loginDialog" aria-labelledby="loginTitle">
    <form class="login-form" id="loginForm">
      <button class="dialog-close" id="closeLoginButton" type="button" aria-label="关闭"><i class="fas fa-times"></i></button>
      <div class="login-icon"><i class="fas fa-shield-halved"></i></div>
      <h2 id="loginTitle">管理员登录</h2>
      <p>登录后可编辑简介、作品和文章。访客浏览和留言不受影响。</p>
      <label for="adminUsername">用户名</label>
      <input id="adminUsername" name="username" type="text" autocomplete="username" maxlength="100" required>
      <label for="adminPassword">密码</label>
      <input id="adminPassword" name="password" type="password" autocomplete="current-password" maxlength="500" required>
      <button class="login-submit" id="loginSubmit" type="submit"><i class="fas fa-arrow-right-to-bracket"></i> 登录</button>
    </form>
  </dialog>

  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
